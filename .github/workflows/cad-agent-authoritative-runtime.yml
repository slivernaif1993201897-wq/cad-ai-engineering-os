name: Authoritative CAD Agent Docker Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cad-agent-authoritative-runtime.yml"
      - "docker/generic-user-job/**"
      - "scripts/ci/generate-cad-agent-runtime-job.ts"
      - "scripts/ci/validate-cad-agent-runtime-failures.ts"
      - "scripts/ci/run-docker-generic-user-job.sh"
      - "scripts/ci/validate_docker_generic_job.py"
      - "scripts/ci/generate-signed-runtime-evidence.ts"
      - "scripts/ci/verify-signed-runtime-evidence.ts"
      - "scripts/ci/diagnose-runtime-evidence-key.ts"
      - "server/cadAgent.ts"
      - "server/cadKernel.ts"
      - "server/signedRuntimeEvidence.ts"
      - "server/runtimeEvidenceApi.ts"
      - "shared/authoritativeCadAgentRuntime.ts"
      - "shared/controlledUserJob.ts"
      - "tests/signed-runtime-evidence.test.ts"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: cad-agent-authoritative-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cad-agent-runtime:
    name: Real CAD Agent revision through Docker CAE runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DEBIAN_FRONTEND: noninteractive
      CAD_AI_JOB_SOURCE: CAD_AGENT
      CAD_AI_RUN_CONTROLLED_FAILURES: "1"
    steps:
      - name: Checkout immutable repository revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install locked JavaScript dependencies
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Execute authoritative CAD Agent Docker job
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/run-docker-generic-user-job.sh
      - name: Generate and verify signed runtime evidence
        shell: bash
        env:
          RUNTIME_EVIDENCE_HMAC_KEY: ${{ secrets.RUNTIME_EVIDENCE_HMAC_KEY }}
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/ci/diagnose-runtime-evidence-key.ts
          test -n "${RUNTIME_EVIDENCE_HMAC_KEY:-}" || { echo "RUNTIME_EVIDENCE_KEY_UNAVAILABLE"; exit 1; }
          [[ "${RUNTIME_EVIDENCE_HMAC_KEY}" =~ ^(0x)?[A-Fa-f0-9]{64,}$ ]] || { echo "RUNTIME_EVIDENCE_KEY_FORMAT_INVALID"; exit 1; }
          pnpm exec tsx scripts/ci/generate-signed-runtime-evidence.ts artifacts/generic-job
          pnpm exec tsx scripts/ci/verify-signed-runtime-evidence.ts artifacts/generic-job/provenance/signed-runtime-evidence.json
          pnpm exec vitest run tests/signed-runtime-evidence.test.ts
      - name: Capture authoritative runtime summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/generic-job/provenance
          cat > artifacts/generic-job/provenance/execution-summary.json <<EOF
          {
            "workflowRunId": "${GITHUB_RUN_ID}",
            "commitSha": "${GITHUB_SHA}",
            "runner": {"os": "${RUNNER_OS}", "arch": "${RUNNER_ARCH}", "environment": "${RUNNER_ENVIRONMENT:-unknown}"},
            "workflowScope": "AUTHORITATIVE_CAD_AGENT_INTERNAL_DOCKER_RUNTIME",
            "cadSource": "CAD_AGENT_VALIDATED_OPEN_CASCADE_REVISION",
            "genericUserInputAccepted": false,
            "arbitraryCommandAccepted": false,
            "networkPolicy": "DOCKER_NETWORK_NONE",
            "productionReadiness": "BLOCKED_PENDING_APPROVED_ENVIRONMENT_AND_INTERNAL_REVIEW"
          }
          EOF
          find artifacts/generic-job -type f -print0 | sort -z | xargs -0 sha256sum > artifacts/generic-job/provenance/all-artifacts.sha256
      - name: Upload authoritative CAD Agent runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cad-agent-authoritative-runtime-evidence-${{ github.run_id }}
          path: artifacts/generic-job/
          if-no-files-found: error
          retention-days: 14
